x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  relay:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.relay
    environment:
      # Required for admin endpoints (used to request-crawl your PDS).
      RELAY_ADMIN_PASSWORD: "${RELAY_ADMIN_PASSWORD:-dummy}"
      # Keep defaults: sqlite DB under /data/relay
      RELAY_PERSIST_DIR: "/data/relay/persist"
      RELAY_REPLAY_WINDOW: "${RELAY_REPLAY_WINDOW:-24h}"
      LOG_LEVEL: "${RELAY_LOG_LEVEL:-info}"
    volumes:
      - atsearch_relay_data:/data/relay
    ports:
      # Bind locally; indexer will talk to it over Docker network.
      # Override on a second droplet instance, e.g. ATSEARCH_RELAY_HTTP_HOSTPORT=127.0.0.1:22470
      - "${ATSEARCH_RELAY_HTTP_HOSTPORT:-127.0.0.1:12470}:2470"
      - "${ATSEARCH_RELAY_WS_HOSTPORT:-127.0.0.1:12471}:2471"

  indexer:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.indexer
    depends_on:
      - relay
    environment:
      ATSEARCH_HTTP_PORT: "3001"
      ATSEARCH_DHT_PORT: "8001"
      ATSEARCH_DB_PATH: "/data/indexer.db"
      # For public hosts, allow libp2p to listen on all interfaces.
      ATSEARCH_LIBP2P_LISTEN_HOST: "0.0.0.0"
      # local = no ingestion (empty index). firehose = consume relay (this stack). poll = listRecords.
      ATSEARCH_MODE: "${ATSEARCH_MODE:-firehose}"
      ATSEARCH_PDS_URL: "${ATSEARCH_PDS_URL:-https://bsky.social}"
      ATSEARCH_HANDLE: "${ATSEARCH_HANDLE:-}"
      ATSEARCH_PASSWORD: "${ATSEARCH_PASSWORD:-}"
      ATSEARCH_NODE_KEY: "${ATSEARCH_NODE_KEY:-}"
      # Firehose: default local relay; set ATSEARCH_FIREHOSE_URL=https://bsky.network in .env for network-wide discovery.
      # Optional: ATSEARCH_FIREHOSE_COLLECTIONS=at.functions.metadata (comma-separated) to filter ingest.
      ATSEARCH_FIREHOSE_URL: "${ATSEARCH_FIREHOSE_URL:-http://relay:2470}"
      ATSEARCH_FIREHOSE_COLLECTIONS: "${ATSEARCH_FIREHOSE_COLLECTIONS:-}"
      # Optional: allow using `#sync` events for relay crawl/backfill (defaults true for http://relay:2470).
      ATSEARCH_FIREHOSE_INCLUDE_SYNC: "${ATSEARCH_FIREHOSE_INCLUDE_SYNC:-}"
      ATSEARCH_LEXICON_MODE: "${ATSEARCH_LEXICON_MODE:-auto}"
      # Bound index growth — a full-firehose subscription otherwise grows forever.
      ATSEARCH_RETENTION_DAYS: "${ATSEARCH_RETENTION_DAYS:-7}"
      ATSEARCH_INGEST_BATCH: "${ATSEARCH_INGEST_BATCH:-500}"
      ATSEARCH_INGEST_FLUSH_MS: "${ATSEARCH_INGEST_FLUSH_MS:-2000}"
      ATSEARCH_LOG_INGEST: "${ATSEARCH_LOG_INGEST:-}"
      ATSEARCH_LEXICON_ALLOWLIST: "${ATSEARCH_LEXICON_ALLOWLIST:-}"
      ATSEARCH_LEXICON_DENYLIST: "${ATSEARCH_LEXICON_DENYLIST:-}"
    volumes:
      - atsearch_data:/data
    # No public ports by default (keep indexer private to the Docker network).

  query-node:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.query-node
    depends_on:
      - indexer
      - relay
    environment:
      ATSEARCH_HTTP_PORT: "3002"
      ATSEARCH_DHT_PORT: "8002"
      ATSEARCH_LIBP2P_LISTEN_HOST: "0.0.0.0"
      ATSEARCH_INDEXER_URLS: "http://indexer:3001"

      USE_MICROCOSM: "${USE_MICROCOSM:-true}"
      MICROCOSM_SLINGSHOT_BASE_URL: "${MICROCOSM_SLINGSHOT_BASE_URL:-https://slingshot.microcosm.blue}"
      MICROCOSM_CONSTELLATION_BASE_URL: "${MICROCOSM_CONSTELLATION_BASE_URL:-https://constellation.microcosm.blue}"
      FALLBACK_ATPROTO_XRPC_BASE_URL: "${FALLBACK_ATPROTO_XRPC_BASE_URL:-https://public.api.bsky.app}"
      APP_USER_AGENT: "${APP_USER_AGENT:-at-search-demo/0.1 (docker)}"
      # Optional: allow a public UI to submit PDS crawl requests safely (server-side).
      ATSEARCH_RELAY_ADMIN_URL: "${ATSEARCH_RELAY_ADMIN_URL:-http://relay:2470}"
      ATSEARCH_RELAY_ADMIN_PASSWORD: "${RELAY_ADMIN_PASSWORD:-dummy}"
      ATSEARCH_CRAWL_WINDOW_MS: "${ATSEARCH_CRAWL_WINDOW_MS:-60000}"
      ATSEARCH_CRAWL_MAX_PER_WINDOW: "${ATSEARCH_CRAWL_MAX_PER_WINDOW:-6}"
    # Expose the API only on localhost so other apps on the droplet can call it
    # without making it reachable from the public internet.
    # Override if 13002 is already taken, e.g. ATSEARCH_QUERY_HOSTPORT=127.0.0.1:13003
    ports:
      - "${ATSEARCH_QUERY_HOSTPORT:-127.0.0.1:13002}:3002"

  web:
    logging: *default-logging
    build:
      context: .
      dockerfile: Dockerfile.demo-client
    depends_on:
      - query-node
    environment:
      ATSEARCH_PUBLIC_HOSTNAME: "${ATSEARCH_PUBLIC_HOSTNAME:-localhost}"
      ATSEARCH_QUERY_UPSTREAM: "http://query-node:3002"
    ports:
      # Public entrypoint (HTTP only by default). Prefer a domain for HTTPS.
      # Second instance: ATSEARCH_WEB_HOSTPORT=28080
      - "${ATSEARCH_WEB_HOSTPORT:-18080}:80"

  # Optional: run the AT Functions API on the same stack, wired to this
  # query node for discovery. Requires the at-functions repo checked out as a
  # sibling directory (../at-functions). Enable with:
  #   COMPOSE_PROFILES=functions docker compose up -d --build
  functions:
    logging: *default-logging
    profiles: ["functions"]
    build:
      context: ../at-functions
      target: api
    depends_on:
      - query-node
    environment:
      HOST: "0.0.0.0"
      PORT: "3000"
      NODE_ENV: "production"
      ATSEARCH_QUERY_URL: "http://query-node:3002"
      ATPROTO_SERVICE: "${ATPROTO_SERVICE:-https://bsky.social}"
      ATFUNCTIONS_CORS_ORIGINS: "${ATFUNCTIONS_CORS_ORIGINS:-}"
      MAX_BLOB_BYTES: "${MAX_BLOB_BYTES:-5242880}"
    ports:
      # Localhost-only: the run endpoint has no auth. Front it with your own
      # reverse proxy (e.g. api.functions.at) if you want it public.
      - "${ATFUNCTIONS_HOSTPORT:-127.0.0.1:13000}:3000"

volumes:
  atsearch_data:
  atsearch_relay_data:

