# AT Search demo static UI + /api → query-node (HTTP only).
# Terminate TLS on the host (e.g. Nginx/Caddy/Cloudflare) and proxy here on :80.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
	worker_connections 1024;
}

http {
	include       /etc/nginx/mime.types;
	default_type  application/octet-stream;
	sendfile      on;
	gzip          on;
	gzip_types    text/css application/javascript application/json image/svg+xml;

	server {
		listen 80;
		server_name _;

		root /usr/share/nginx/html;

		# Demo client calls `${origin}/api/...`; strip `/api` for query-node.
		location /api/ {
			proxy_pass http://query-node:3002/;
			proxy_http_version 1.1;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
		}

		location / {
			try_files $uri $uri/ /index.html;
		}
	}
}
